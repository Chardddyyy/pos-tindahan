<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>{% block title %}{% endblock %} · {{ store_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body class="page-{{ active }}">
  <header class="topbar">
    <div class="brand">🏪 {{ store_name }}</div>
    <nav class="nav" aria-label="Main menu">
      <a href="{{ url_for('pages.pos') }}" class="{{ 'active' if active == 'pos' }}">Sales</a>
      <a href="{{ url_for('pages.drawer') }}" class="{{ 'active' if active == 'drawer' }}">Cash Drawer</a>
      <a href="{{ url_for('pages.calendar') }}" class="{{ 'active' if active == 'calendar' }}">Calendar</a>
      <a href="{{ url_for('pages.stock_in') }}" class="{{ 'active' if active == 'stock_in' }}">Stock In</a>
      <a href="{{ url_for('pages.inventory') }}" class="{{ 'active' if active == 'inventory' }}">Inventory</a>
      <a href="{{ url_for('pages.reports') }}" class="{{ 'active' if active == 'reports' }}">Reports</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
